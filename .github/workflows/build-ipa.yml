name: Build iPad app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SpeedReader.xcodeproj \
            -scheme SpeedReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | head -40; exit 1; }
          grep -E "BUILD SUCCEEDED" xcodebuild.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpeedReader.app Payload/
          zip -qry SpeedReaderUltra.ipa Payload
          ls -lh SpeedReaderUltra.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SpeedReaderUltra-ipa
          path: SpeedReaderUltra.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
